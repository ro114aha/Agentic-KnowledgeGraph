services:
  app:
    image: mcr.microsoft.com/devcontainers/dotnet:1-8.0
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
    depends_on:
      - neo4j

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password123   # demo only - never commit real credentials
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
